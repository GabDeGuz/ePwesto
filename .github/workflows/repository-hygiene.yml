name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js for repository validation
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run repository hygiene validation
        run: node scripts/verify/repository.mjs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install web dependencies
        working-directory: apps/web
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts
      - name: Verify web baseline
        run: node scripts/verify/web.mjs

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci --ignore-scripts
      - name: Verify mobile baseline
        run: node scripts/verify/mobile.mjs
